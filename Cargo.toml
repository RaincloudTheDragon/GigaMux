[workspace]
resolver = "2"
members = [
    "apps/GigaMux",
    "crates/gigamux-core",
]
default-members = ["apps/GigaMux"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Unlicense"
publish = false

[workspace.dependencies]
gigamux-core = { path = "crates/gigamux-core" }
eframe = "0.31"
egui = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
rfd = "0.17"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
