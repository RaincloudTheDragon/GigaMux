[workspace]
resolver = "2"
members = [
    "apps/GigaMux",
    "apps/gigamux-check",
    "crates/gigamux-core",
]
default-members = ["apps/GigaMux"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Unlicense"
publish = false

[workspace.dependencies]
gigamux-core = { path = "crates/gigamux-core" }
eframe = "0.37"
egui = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
rfd = "0.18"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
flate2 = "1"
trash = "5"

# Dolphin smb:// XDnD (X11): stock winit only allows file://. patches/winit+VERSION.patch + ensure-winit-patch.sh after clone/clean.
# App defaults to Wayland; GIGAMUX_X11=1 when you need that DnD path. Refresh .patch + path when winit bumps.
[patch.crates-io]
winit = { path = "target/patch/winit-0.30.13" }
