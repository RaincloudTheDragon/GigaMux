[workspace]
resolver = "2"
members = [
    "apps/GigaMux",
    "apps/gigamux-check",
    "crates/gigamux-core",
]
default-members = ["apps/GigaMux"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Unlicense"
publish = false

[workspace.dependencies]
gigamux-core = { path = "crates/gigamux-core" }
eframe = "0.37"
egui = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
rfd = "0.18"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
flate2 = "1"
trash = "5"

# Dolphin smb:// XDnD: stock winit only allows file://. Commit is patches/winit+VERSION.patch only; run ./scripts/ensure-winit-patch.sh once after clone/clean (CI does this) so target/patch/winit-VERSION exists.
# Dependabot still bumps winit via the lockfile; refresh the .patch + this path when the version changes.
[patch.crates-io]
winit = { path = "target/patch/winit-0.30.13" }
