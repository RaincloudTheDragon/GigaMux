[package]
name = "GigaMux"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "GigaMux desktop shell (egui/eframe)"

[[bin]]
name = "GigaMux"
path = "src/main.rs"

[dependencies]
gigamux-core = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
rfd = { workspace = true }
chrono = { workspace = true }

# Force gpu-allocator onto the same `windows` as wgpu-hal (0.62); otherwise the lockfile can pick windows 0.58 for gpu-allocator and break the D3D12 build with egui/eframe 0.37.
[target.'cfg(windows)'.dependencies]
windows = "0.62"
